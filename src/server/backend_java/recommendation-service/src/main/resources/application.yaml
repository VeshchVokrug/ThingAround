spring:
  application:
    name: recommendation-service

  # Конфигурация RabbitMQ — единственный брокер сообщений сервиса
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin}
    listener:
      simple:
        max-concurrency: 5
        prefetch: 10
        # Не возвращать необработанные сообщения в очередь —
        # после исчерпания retry они уходят в DLQ
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-retries: 3

  # Конфигурация Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: recommendation-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s
  threads:
    virtual:
      enabled: true

# Конфигурация сервера
server:
  port: 8084

# gRPC сервер (для интеграции с C#)
grpc:
  server:
    port: 50054
  catalog:
    host: localhost
    port: 50051
  identity:
    host: localhost
    port: 50052
  rental:
    host: localhost
    port: 50053

logging:
  level:
    root: INFO
    ru.veshvokrug.recommendation: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Конфигурация сервиса рекомендаций
recommendation:
  integration:
    # TTL контекста бронирования (bookingId -> пользователь/листинг/категория),
    # нужен для маппинга Approved/Cancelled-событий саги, в которых нет listingId
    booking-context-ttl-days: 90
  weights:
    user-interest-half-life-days: 30
    listing-popularity-half-life-days: 14
    min-category-weight-threshold: 0.001
    top-categories-count: 5
    top-listings-per-category: -1  # Автоматический расчёт по размеру выдачи
    default-recommendation-size: 20
    recommendation-cache-ttl-seconds: 300

# Actuator для мониторинга
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
