spring:
  application:
    name: coownership-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin}
    listener:
      simple:
        # Не возвращать необработанные сообщения в очередь —
        # после исчерпания retry они уходят в DLQ
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-retries: 3
  jpa:
    show-sql: false  # true только при отладке локально
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: co-ownership-scheduler-
  threads:
    virtual:
      enabled: true
# Scheduler config for notification cleanup
coownership:
  notification:
    purge-interval-ms: 3600000  # 1 hour in milliseconds
    purge-initial-delay-ms: 60000  # 1 minute initial delay
    storage-retention-days: 30  # Delete notifications older than 30 days
  listing:
    # Время ежедневной отмены листингов с истёкшим дедлайном финансирования (UTC)
    funding-deadline-cron: ${COOWNERSHIP_FUNDING_DEADLINE_CRON:0 30 2 * * *}
  rabbitmq:
    catalog-commands-exchange: ${COOWNERSHIP_RABBITMQ_CATALOG_COMMANDS_EXCHANGE:coownership-commands}
    events-exchange: ${COOWNERSHIP_RABBITMQ_EVENTS_EXCHANGE:coownership-events}
    inbound:
      # Один exchange для всех rental-событий (MassTransit IRentalEvents)
      rental-events-exchange: ${COOWNERSHIP_RABBITMQ_RENTAL_EVENTS_EXCHANGE:rental-events}
      rental-events-queue: ${COOWNERSHIP_RABBITMQ_RENTAL_EVENTS_QUEUE:coownership.rental-events}
  outbox:
    relay-interval-ms: ${COOWNERSHIP_OUTBOX_RELAY_INTERVAL_MS:5000}
    batch-size: ${COOWNERSHIP_OUTBOX_BATCH_SIZE:100}
    retry-delay-seconds: ${COOWNERSHIP_OUTBOX_RETRY_DELAY_SECONDS:30}
  period:
    settlement:
      cron: ${COOWNERSHIP_PERIOD_SETTLEMENT_CRON:0 0 2 * * *}

grpc:
  server:
    enabled: ${GRPC_SERVER_ENABLED:true}
    port: ${GRPC_SERVER_PORT:9091}

server:
  port: 8085