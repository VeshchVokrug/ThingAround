services:
  coownership-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coownership-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${COOWNERSHIP_DB_NAME:-postgres}
      SPRING_DATASOURCE_USERNAME: ${COOWNERSHIP_DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${COOWNERSHIP_DB_PASSWORD:-admin}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${COOWNERSHIP_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      GRPC_SERVER_PORT: ${COOWNERSHIP_GRPC_PORT:-9091}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JAVA_OPTS: "-Xms256m -Xmx512m"
      TZ: UTC
    ports:
      - "9091:9091"
    networks:
      - thingaround-network
    restart: on-failure

networks:
  thingaround-network:
    external: true
    driver: bridge
