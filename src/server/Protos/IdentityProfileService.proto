syntax = "proto3";

package identityprofile.protos;

option csharp_namespace = "IdentityProfileService.Grpc";

import "google/protobuf/empty.proto";

service IdentityProfileService {
  // --- Auth Section ---
  rpc Register(AuthRequest) returns (AuthResponse);
  rpc Login(AuthRequest) returns (AuthResponse);
  rpc Refresh(RefreshRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);

  // --- Profile Section ---
  rpc GetProfile(google.protobuf.Empty) returns (PersonalProfileResponse);
  rpc GetProfileById(GetProfileByIdRequest) returns (PublicProfileResponse);
  rpc CreateProfile(CreateProfileRequest) returns (PersonalProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (PersonalProfileResponse);
  rpc RemoveAvatar(google.protobuf.Empty) returns (google.protobuf.Empty);
  
  // --- Categories Section ---
  rpc AddFavoriteCategories(CategoriesRequest) returns (PersonalProfileResponse);
  rpc RemoveFavoriteCategories(CategoriesRequest) returns (PersonalProfileResponse);
}

// --- Auth Messages ---
message AuthRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string refresh_token_expires_hours = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message RefreshRequest {
  string access_token = 1;
  string refresh_token = 2;
}

// --- Profile Messages ---
message GetProfileByIdRequest {
  string id = 1;
}

message PublicProfileResponse {
  string id = 1;
  optional string name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
  double reputation = 5;
}

message PersonalProfileResponse {
  string id = 1;
  optional string name = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
  double reputation = 5;
  repeated string favorite_categories = 6;
}

message CreateProfileRequest {
  string name = 1;
  string bio = 2;
  optional string avatar_url = 3;
  repeated string favorite_categories = 4;
}

message UpdateProfileRequest {
  optional string name = 1;
  optional string bio = 2;
  optional string avatar_url = 3;
}

message CategoriesRequest {
  repeated string categories = 1;
}